<div class="main">
  <header class="top-nav">
    <h1>Angular components</h1>
  </header>
  <nav class="side-bar" aria-label="Components">
    @for (item of navItems; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">
        {{ item.title }}
      </a>
    }
  </nav>
  <main class="content">
    <router-outlet />
  </main>
</div>
